user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Student photos and PDF downloads; Livewire uploads go through here too.
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Fly terminates TLS at the edge and forwards over http. Without this
        # Laravel builds http:// asset URLs on an https page and the browser
        # blocks them as mixed content.
        real_ip_header X-Forwarded-For;
        set_real_ip_from 0.0.0.0/0;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # public/storage and public/storage/tenants/{id} are symlinks into the
        # volume — nginx must be allowed to follow them off the docroot.
        location /storage/ {
            disable_symlinks off;
            try_files $uri =404;
            expires 7d;
            access_log off;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $http_x_forwarded_proto;
            fastcgi_hide_header X-Powered-By;
            # A term-end result PDF for a whole jamaat can take a while.
            fastcgi_read_timeout 120s;
        }

        location ~ /\.(?!well-known).* { deny all; }
    }
}
