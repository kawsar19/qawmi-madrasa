[www]
user = nginx
group = nginx
listen = 127.0.0.1:9000

; A 256MB Fly machine fits roughly this many workers alongside nginx.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Log worker output to the container, so `fly logs` shows PHP warnings.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
clear_env = no
